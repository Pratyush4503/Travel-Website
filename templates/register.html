{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create your account</h2>
        <p class="auth-subtitle">Join TripEase and start exploring India</p>
        <form action="" method="post" class="auth-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Pratyush Parashar" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Phone (optional)</label>
                <input type="tel" name="phone" placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min. 6 characters" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>
        <p class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
